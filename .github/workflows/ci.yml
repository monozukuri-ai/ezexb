name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p ezexb-core
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: uv run --locked python scripts/check_docs.py
      - run: uv run --locked python scripts/bump_version.py --check
      - run: uv build --out-dir dist
      - run: uv run --locked python scripts/check_artifacts.py dist
      - run: uv run --locked python scripts/verify_wheel.py dist --python '${{ matrix.python }}'
      - name: Rebuild from sdist
        if: runner.os == 'Linux' && matrix.python == '3.10'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/ezexb-sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/ezexb-sdist"
          uv build --wheel "$RUNNER_TEMP/ezexb-sdist"/ezexb-* --out-dir "$RUNNER_TEMP/rebuilt"
          uv run --locked python scripts/verify_wheel.py "$RUNNER_TEMP/rebuilt" --python 3.10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.10'
        with:
          name: ci-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@1.83.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - run: cargo test --locked -p ezexb-core
      - run: cargo check --locked --workspace

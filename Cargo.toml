[workspace]
members = ["crates/ezexb-core", "crates/ezexb-python"]
default-members = ["crates/ezexb-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/monozukuri-ai/ezexb"
authors = ["neka-nat"]

[workspace.dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }

[profile.release]
lto = "thin"
codegen-units = 1
